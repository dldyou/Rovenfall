plugins {
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

repositories {
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('quickPlayMultiplayer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('quickPlayMultiplayer').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.rovenfall
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    testImplementation(enforcedPlatform('org.junit:junit-bom:6.1.3'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri(layout.projectDirectory.dir('repo'))
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('runServer') {
    standardInput = System.in
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    def performanceReport = layout.buildDirectory.file('reports/performance-budget.md')
    systemProperty 'rovenfall.performanceReport', performanceReport.get().asFile.absolutePath
    outputs.file(performanceReport)
}

tasks.register('performanceBudget') {
    group = 'verification'
    description = 'Runs the deterministic 20/50-player load fixture and writes its CI report.'
    dependsOn tasks.named('test')
}

tasks.register('recoveryRehearsal') {
    group = 'verification'
    description = 'Runs unit recovery fixtures, the performance budget, and the server GameTests.'
    dependsOn tasks.named('test'), tasks.named('performanceBudget'), tasks.named('runGameTestServer')
}

def distributableJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def inspectReleaseJar = tasks.register('inspectReleaseJar') {
    group = 'verification'
    description = 'Inspects the distributable mod JAR for required runtime content and development-file leaks.'
    dependsOn tasks.named('jar')
    inputs.file(distributableJar)

    doLast {
        def archive = distributableJar.get().asFile
        if (!archive.isFile() || archive.length() == 0) {
            throw new GradleException("Distributable JAR is missing or empty: ${archive}")
        }
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def entries = new LinkedHashSet<String>()
            zip.entries().each { entries.add(it.name) }
            def required = [
                    'META-INF/MANIFEST.MF',
                    'META-INF/neoforge.mods.toml',
                    'rovenfall.mixins.json',
                    'org/dldyou/rovenfall/Rovenfall.class',
                    'org/dldyou/rovenfall/administration/RovenfallInventoryScreen.class',
                    'org/dldyou/rovenfall/administration/RovenfallAdministrationMenuScreen.class',
                    'org/dldyou/rovenfall/administration/RovenfallAdministrationMenus.class',
                    'org/dldyou/rovenfall/quest/ContractJourneyView.class',
                    'org/dldyou/rovenfall/quest/RepeatableContractService.class',
                    'org/dldyou/rovenfall/quest/ActiveJourneyService.class',
                    'org/dldyou/rovenfall/quest/ActiveJourneyView.class',
                    'org/dldyou/rovenfall/quest/ActiveJourneyTrackerPayloads.class',
                    'org/dldyou/rovenfall/quest/ActiveJourneyTrackerNetwork.class',
                    'org/dldyou/rovenfall/quest/ActiveJourneyTrackerClient.class',
                    'org/dldyou/rovenfall/quest/ActiveJourneyTrackerHud.class',
                    'org/dldyou/rovenfall/exploration/ExplorationDefinitionReloadListener.class',
                    'org/dldyou/rovenfall/exploration/ExplorationDiscoveryService.class',
                    'org/dldyou/rovenfall/exploration/ExplorationJournalView.class',
                    'org/dldyou/rovenfall/exploration/ExplorationPlayerSavedData.class',
                    'org/dldyou/rovenfall/exploration/ExplorationRuntime.class',
                    'assets/rovenfall/lang/en_us.json',
                    'assets/rovenfall/lang/ja_jp.json',
                    'assets/rovenfall/lang/ko_kr.json',
                    'data/rovenfall/rovenfall/quests/contracts/daily_combat_drill.json',
                    'data/rovenfall/rovenfall/quests/contracts/daily_hunt_patrol.json',
                    'data/rovenfall/rovenfall/quests/contracts/daily_market_delivery.json',
                    'data/rovenfall/rovenfall/quests/contracts/daily_mining_survey.json',
                    'data/rovenfall/rovenfall/quests/contracts/weekly_mining_expedition.json',
                    'data/rovenfall/rovenfall/quests/contracts/weekly_rift_hunt.json',
                    'data/rovenfall/rovenfall/discoveries/hub_arrival.json',
                    'data/rovenfall/rovenfall/discoveries/hub_commons.json',
                    'data/rovenfall/rovenfall/discoveries/wilderness_trailhead.json',
                    'data/rovenfall/rovenfall/discoveries/weathered_ruins.json'
            ]
            def missing = required.findAll { !entries.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Distributable JAR is missing runtime entries: ${missing}")
            }
            def forbidden = entries.findAll { entry ->
                entry.endsWith('.java')
                        || entry.startsWith('.git/')
                        || entry.startsWith('.gradle/')
                        || entry.startsWith('build/')
                        || entry.startsWith('run/')
                        || entry.startsWith('src/')
                        || entry.startsWith('TEST-')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Distributable JAR contains development entries: ${forbidden.take(20)}")
            }
            def metadataEntry = zip.getEntry('META-INF/neoforge.mods.toml')
            def metadata = zip.getInputStream(metadataEntry).withCloseable { it.getText('UTF-8') }
            if (!metadata.contains('modId = "rovenfall"') || metadata.contains('${mod_version}')) {
                throw new GradleException('Distributable JAR contains invalid or unexpanded mod metadata')
            }
        }
        logger.lifecycle("Inspected distributable JAR: ${archive.name} (${archive.length()} bytes)")
    }
}

tasks.named('check') {
    dependsOn inspectReleaseJar
}

tasks.named('jacocoTestReport', JacocoReport).configure {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

