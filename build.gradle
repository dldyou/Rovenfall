                'data/rovenfall/neoforge/biome_modifier/frostbound_reaver_spawns.json',
                'data/rovenfall/neoforge/biome_modifier/frostbound_reaver_spawn_costs.json',
                'data/rovenfall/tags/worldgen/biome/frostbound_reaver_spawns.json',
                'data/rovenfall/neoforge/biome_modifier/tidebound_raider_spawns.json',
                'data/rovenfall/neoforge/biome_modifier/tidebound_raider_spawn_costs.json',
                'data/rovenfall/tags/worldgen/biome/tidebound_raider_spawns.json',
                'data/rovenfall/neoforge/biome_modifier/deepstone_husk_spawns.json',
                'data/rovenfall/neoforge/biome_modifier/deepstone_husk_spawn_costs.json',
                'data/rovenfall/tags/worldgen/biome/deepstone_husk_spawns.json',
                'data/rovenfall/rovenfall/mob_mutations/ashen.json',
                'data/rovenfall/rovenfall/mob_mutations/tempest.json',
                'data/rovenfall/rovenfall/mob_mutations/bulwark.json',
                'data/rovenfall/rovenfall/mob_mutations/frenzied.json'
        ]
        new java.util.zip.ZipFile(artifact).withCloseable { archive ->
            requiredEntries.each { entry ->
                if (archive.getEntry(entry) == null) {
                    throw new GradleException("Release artifact is missing required entry: ${entry}")
                }
            }
            if (archive.entries().toList().any { entry ->
                entry.name.startsWith('org/junit/') || entry.name.startsWith('net/minecraft/')
            }) {
                throw new GradleException('Release artifact contains test or bundled Minecraft classes')
            }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        artifact.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int count = input.read(buffer); count >= 0; count = input.read(buffer)) {
                digest.update(buffer, 0, count)
            }
        }
        String sha256 = digest.digest().encodeHex().toString().toUpperCase(java.util.Locale.ROOT)
        println "Verified release artifact: ${artifact} (${artifact.length()} bytes, SHA-256 ${sha256})"
    }
}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Runs unit tests, NeoForge GameTests, the full build, and release JAR verification.'
    dependsOn tasks.named('build')
    dependsOn tasks.named('runGameTestServer')
    dependsOn tasks.named('verifyReleaseArtifact')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
