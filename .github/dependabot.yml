version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: Asia/Seoul
    labels:
      - dependencies
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "00:15"
      timezone: Asia/Seoul
    labels:
      - dependencies
      - domain:build
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5

