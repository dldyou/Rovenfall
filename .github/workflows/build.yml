name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and GameTest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and run unit tests
        run: ./gradlew build --warning-mode all

      - name: Run required GameTests
        run: ./gradlew runGameTestServer

      - name: Upload performance budget report
        if: ${{ always() && hashFiles('build/reports/performance-budget.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: performance-budget-${{ github.sha }}
          path: build/reports/performance-budget.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish performance budget summary
        if: ${{ always() && hashFiles('build/reports/performance-budget.md') != '' }}
        run: cat build/reports/performance-budget.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: rovenfall-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14

