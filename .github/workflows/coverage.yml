name: Code coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: JUnit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JUnit coverage report
        run: ./gradlew test jacocoTestReport --warning-mode all

      - name: Summarize coverage
        if: ${{ always() && hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != '' }}
        shell: bash
        run: |
          python3 - build/reports/jacoco/test/jacocoTestReport.xml >> "${GITHUB_STEP_SUMMARY}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report = ET.parse(sys.argv[1]).getroot()
          counters = {counter.attrib["type"]: counter.attrib for counter in report.findall("counter")}
          print("## Code coverage\n")
          print("| Metric | Coverage |\n| --- | --- |")
          for metric in ("LINE", "BRANCH"):
              counter = counters.get(metric, {"covered": "0", "missed": "0"})
              covered = int(counter["covered"])
              total = covered + int(counter["missed"])
              percentage = covered * 100 / total if total else 100
              print(f"| {metric.title()} | {percentage:.2f}% ({covered}/{total}) |")
          PY

      - name: Upload JaCoCo reports
        if: ${{ always() && hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-coverage-${{ github.sha }}
          path: build/reports/jacoco/test/
          if-no-files-found: error
          retention-days: 14
